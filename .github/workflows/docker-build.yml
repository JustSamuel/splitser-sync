name: Docker build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dockerize:
    uses: GEWIS/actions/.github/workflows/docker-build.yml@00d200d2d7d17ad3d58c7ec3464c7d2ecff2d814 # v1
    with:
      projects: '["."]'
