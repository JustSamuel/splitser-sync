name: Release

on:
  push:
    branches:
      - main

# Never run two releases at once, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  versioning:
    uses: GEWIS/actions/.github/workflows/versioning.yml@00d200d2d7d17ad3d58c7ec3464c7d2ecff2d814 # v1
    permissions:
      contents: write
      pull-requests: write
      issues: write

  release:
    uses: GEWIS/actions/.github/workflows/docker-release-ghcr.yml@00d200d2d7d17ad3d58c7ec3464c7d2ecff2d814 # v1
    needs: versioning
    if: ${{ needs.versioning.outputs.next-version != '' }}
    permissions:
      contents: read
      packages: write
    with:
      projects: '["."]'
      docker-paths: '["justsamuel/splitser-sync"]'
      version: ${{ needs.versioning.outputs.next-version }}
